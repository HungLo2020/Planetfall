<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Planetfall</title>
  <defs>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fcf6a"/>
      <stop offset="1" stop-color="#2d5a2a"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff8e30"/>
    </linearGradient>
  </defs>
  <!-- planet horizon -->
  <circle cx="256" cy="560" r="300" fill="url(#planet)"/>
  <path d="M-10 330 Q256 230 522 330" fill="none" stroke="#ff8e30" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <!-- re-entry trail -->
  <path d="M226 30 L286 30 L276 250 L236 250 Z" fill="url(#flame)"/>
  <!-- drop pod -->
  <g transform="translate(256 300)">
    <path d="M-44 -60 L44 -60 L60 40 L-60 40 Z" fill="#dfe3e6" stroke="#2b3036" stroke-width="8" stroke-linejoin="round"/>
    <path d="M-30 -60 L0 -100 L30 -60 Z" fill="#ff8e30" stroke="#2b3036" stroke-width="8" stroke-linejoin="round"/>
    <rect x="-26" y="-34" width="52" height="16" rx="4" fill="#4fd8ff"/>
    <path d="M-60 40 L-84 72 M60 40 L84 72" stroke="#2b3036" stroke-width="10" stroke-linecap="round"/>
    <path d="M-30 40 L0 92 L30 40 Z" fill="#ffb347"/>
  </g>
</svg>
