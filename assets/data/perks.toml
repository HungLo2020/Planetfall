# Level-up field perks (lost when the drop ends), offered beside the weapon
# and ability upgrades in mods.toml. Each offer rolls a rarity; `amount` is
# the common value and scales by tuning.rarity.perk_scale (multiplicative
# effects scale their change from 1). In descriptions `{amount}` is the
# scaled value and `{percent}` the change as a percentage.
#
# effect: max_health (also heals), move_speed (multiplier), damage,
# fire_rate (cooldown multiplier), pickup_range, mining, regeneration (HP/s),
# ore_bonus (chance of an extra ore drop), extraction_speed (faster hold),
# dash_cooldown (multiplier), heavy_damage (bonus against enemies with 100+
# health), ability_cooldown (multiplier), luck (better upgrade rarities). `max` caps the stacked total of an
# additive effect. Class perks (`class`) are only offered to that class,
# from class level `class_level`.

[[perk]]
id = "reinforced-suit"
title = "Reinforced Suit"
description = "+{amount} max health and heal {amount}."
effect = "max_health"
amount = 20.0
weight = 2

[[perk]]
id = "servo-boots"
title = "Servo Boots"
description = "+{percent}% movement speed."
effect = "move_speed"
amount = 1.1
weight = 2

[[perk]]
id = "overcharge"
title = "Overcharge"
description = "+{percent}% damage for all weapons."
effect = "damage"
amount = 0.15
weight = 2

[[perk]]
id = "rapid-cycling"
title = "Rapid Cycling"
description = "Weapons cycle {percent}% faster."
effect = "fire_rate"
amount = 0.9
weight = 2

[[perk]]
id = "magnetic-field"
title = "Magnetic Field"
description = "+{amount} m pickup range."
effect = "pickup_range"
amount = 1.5
weight = 2

[[perk]]
id = "hardened-drill"
title = "Hardened Drill"
description = "+{percent}% mining speed."
effect = "mining"
amount = 0.4
weight = 1

[[perk]]
id = "nanite-repair"
title = "Nanite Repair"
description = "Regenerate {amount} health per second."
effect = "regeneration"
amount = 1.0
weight = 2
max = 3.0

[[perk]]
id = "lucky-charm"
title = "Lucky Charm"
description = "+{percent}% luck: rarer upgrades turn up more often."
effect = "luck"
amount = 0.25
weight = 1
max = 1.5

