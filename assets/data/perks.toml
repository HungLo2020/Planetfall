# Level-up field perks (lost when the drop ends). New-weapon and weapon-level
# choices come from weapons.toml. effect: max_health (also heals), move_speed
# (multiplier), damage, fire_rate (cooldown multiplier), pickup_range,
# mining, regeneration (HP/s). `max` caps the stacked total of an effect.

