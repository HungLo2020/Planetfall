# Level-up upgrades for weapons and class abilities. Each offer rolls a
# rarity (common, uncommon, rare, legendary; odds in tuning.toml) and the
# mod's `amounts` gives its value at each rarity. Every upgrade taken on a
# weapon also adds tuning.weapons.growth to its damage (the weapon's level).
# Field and class perks (perks.toml) scale by rarity too.
#
# target: "weapon" (applies to one carried weapon) or "ability".
# stat (weapon): damage (% more), fire_rate (% faster), count (+N
#   projectiles, pellets, chain jumps, shells or drones), range (% longer),
#   area (% larger radius), pierce (+N), element (adds `element` with
#   amounts as potency), special (a behaviour change, see `special`).
# stat (ability): cooldown (% faster), power (% more damage), reach (% more
#   range, duration and posts), special.
# min_rarity: the lowest rarity this mod can roll at.
# behaviors / abilities: only for these weapon behaviours / ability kinds.
# max_stacks: how many times one weapon (or the ability) can take it.
#
# Specials (code archetypes):
#   twin_barrel   bolt: every shot also fires at a second target
#   double_blast  scatter: a second fan fires behind you
#   overload      arc: every jump forks to a second enemy
#   cluster       mortar: shells split into three bomblets
#   second_ring   orbit: a second, wider ring turning the other way
#   mobile_sentry sentry: the turrets walk with you
#   overcharge    dome: the dome shocks enemies inside it
#   echo          blink: a second charge before the cooldown
#   molten_bore   bore: wider, and sets everything in it on fire
#   arc_fence     barrier: posts zap twice as far, with shock

[[mod]]
id = "hotter-rounds"
title = "Spicy Rounds"
description = "+{amount}% damage"
target = "weapon"
stat = "damage"
amounts = [20.0, 32.0, 48.0, 70.0]
weight = 4

[[mod]]
id = "cycler"
title = "Itchy Trigger"
description = "Fires {amount}% faster"
target = "weapon"
stat = "fire_rate"
amounts = [12.0, 18.0, 26.0, 36.0]
weight = 3
max_stacks = 6

[[mod]]
id = "extra-payload"
title = "Bulk Discount"
description = "+{amount} projectiles, pellets, jumps, shells or drones"
target = "weapon"
stat = "count"
amounts = [1.0, 1.0, 2.0, 3.0]
min_rarity = "uncommon"
weight = 2
max_stacks = 4

[[mod]]
