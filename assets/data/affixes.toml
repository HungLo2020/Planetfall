# Random equipment affixes. An item gets `tuning.equipment.affixes` of them
# by rarity (no repeats), each rolled in `range` and scaled by rarity and
# hazard (`tuning.equipment.scale`, `hazard_scale`). `slots` limits where an
# affix rolls (empty: any). The first affix names the item.

[[affix]]
id = "sturdy"
name = "Sturdy"
effect = "max_health"
range = [6.0, 14.0]
slots = ["helmet", "suit", "boots"]
weight = 4

