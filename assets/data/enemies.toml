# Enemies: behaviour archetypes are code; numbers, drops, spawning, model and
# sounds are data.
#
# behavior: "walker" (steady melee), "lunger" (speeds up when close),
#           "exploder" (detonates on contact or death), "spitter" (keeps
#           its distance and spits: `ranged`), "disruptor" (jamming pulse
#           that slows weapons and blocks abilities: `pulse`), "burrower"
#           (tunnels through rock unseen and surfaces near you: `burrow`),
#           "flyer" (flies straight over rock).
# tint: linear RGB over the model (role variants share rigs for now).
# special (bosses): brood (calls enemies), lava_trail (burning ground),
#                   frost_nova (slows nearby players), volley (fan of spit).
# spawn: weight relative to other enemies, group size range, the threat
#        level a drop must reach first (see tuning.toml [threat]), and
#        whether it appears in the tutorial. Planets scale weights.
# drops: rolled on death; amount of a material with a chance (1 = always).
# boss: placed by objectives only (spawn weight 0); scale: model size.

[[enemy]]
id = "husk"
name = "Husk"
behavior = "walker"
health = 26.0
speed = 2.7
damage = 9.0
radius = 0.45
xp = 2
model = "husk"
