# Enemies: behaviour archetypes are code; numbers, drops, spawning, model and
# sounds are data.
#
# behavior: "walker" (steady melee), "lunger" (speeds up when close),
#           "exploder" (detonates on contact or death).
# spawn: weight relative to other enemies, group size range, the minute a
#        drop must reach first, and whether it waits for late game (2.5 min
#        or extraction) or skips the tutorial. Planets scale weights.
# drops: rolled on death; amount of a material with a chance (1 = always).

[[enemy]]
id = "husk"
name = "Husk"
behavior = "walker"
health = 26.0
speed = 2.7
damage = 9.0
radius = 0.45
xp = 2
model = "husk"
blood = [0.35, 0.65, 0.2]
death_sound = "enemy_die"
alert_sound = "husk_groan"
alert_chance = 0.35
spawn = { weight = 0.5, count = [2, 4] }
drops = [{ material = "ferrite", amount = 1, chance = 0.04 }]

