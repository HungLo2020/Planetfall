# Weapons: behaviour archetypes are code (bolt, scatter, arc, mortar,
# orbit, flamer, ricochet, mines, melee, homing, gravity; numbers for the
# newer ones in tuning.toml [arsenal]); everything else is data. `stats` are the base numbers; level-up
# upgrades (mods.toml) stack on top during a drop. Which weapon a dive starts
# with comes from the class (classes.toml); more are picked at dive levels 5,
# 10 and 15.
#
# element: optional base element applied on hit: { kind, potency } with kind
# fire (burn damage per second), acid (corrode: damage over time and +25%
# damage taken), cold (chill that slows, then freezes) or shock (chance to
# arc potency damage to a nearby enemy).
# model: held model (a name from assets/models or models.toml),
# turned by model_yaw degrees; color: linear
# RGB of projectiles and muzzle light; sound: clip name in assets/sounds.

[[weapon]]
id = "pulse-blaster"
name = "Pulse Blaster"
description = "Rapid bolts at the nearest hostile."
behavior = "bolt"
model = "blaster"
model_scale = 0.7
# Kenney blasters face the other way.
model_yaw = 180.0
sound = "blaster"
volume = 0.35
color = [0.5, 0.95, 1.0]
stats = { cooldown = 0.42, damage = 11.0, range = 13.0, count = 1, speed = 26.0, radius = 0.25, pierce = 0 }

