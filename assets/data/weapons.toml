# Weapons: behaviour archetypes are code (bolt, scatter, arc, mortar,
# orbit); everything else is data. `levels` lists levels 1..5. Which weapon a
# dive starts with comes from the class (classes.toml).
# model: held model (a name from assets/models or models.toml),
# turned by model_yaw degrees; color: linear
# RGB of projectiles and muzzle light; sound: clip name in assets/sounds.

[[weapon]]
id = "pulse-blaster"
name = "Pulse Blaster"
description = "Rapid bolts at the nearest hostile."
behavior = "bolt"
model = "blaster"
model_scale = 0.7
# Kenney blasters face the other way.
model_yaw = 180.0
sound = "blaster"
volume = 0.35
color = [0.5, 0.95, 1.0]
levels = [
  { cooldown = 0.42, damage = 11.0, range = 13.0, count = 1, speed = 26.0, radius = 0.25, pierce = 0 },
  { cooldown = 0.38, damage = 14.0, range = 13.0, count = 1, speed = 26.0, radius = 0.25, pierce = 0 },
  { cooldown = 0.34, damage = 17.0, range = 13.0, count = 1, speed = 26.0, radius = 0.25, pierce = 0 },
  { cooldown = 0.3, damage = 20.0, range = 13.0, count = 2, speed = 26.0, radius = 0.25, pierce = 0 },
  { cooldown = 0.26, damage = 23.0, range = 13.0, count = 2, speed = 26.0, radius = 0.25, pierce = 1 },
