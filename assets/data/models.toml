crate-wide = "kenney/blaster-kit/crate-wide.glb"
barrel = "kenney/survival-kit/barrel.glb"
workbench = "kenney/survival-kit/workbench.glb"
metal-panel = "kenney/survival-kit/metal-panel.glb"
