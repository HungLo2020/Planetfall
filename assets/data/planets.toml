# Planets, in unlock order. `nav_level` is the Reactor & Nav Core level
# needed to plot a course. `ore` is the chance an exposed wall becomes each
# ore. `spawn_weights` multiplies enemy spawn weights on this planet.
# Palette colours are linear RGB. `[planet.terrain]` shapes the caves
# (see `TerrainStyle`): extra `chambers` [min, max], `chamber_radius` and
# `tunnel_width` ranges in blocks, wall `roughness`, `loops` (chance of extra
# tunnels), noise `alcoves`, floor `patches`, ore `seams` density, and
# `decor` props (fungus, crystal, ice) at `decor_density`.

[[planet]]
id = "verdant"
name = "Verdant-7"
kind = "Overgrown moon"
description = "Mossy caverns infested by husks. Rich in ferrite. A good first drop."
