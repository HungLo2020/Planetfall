# Crew classes, switched in the ship's locker room. Each class keeps its own
# level, unlocks and loadout per save.
#
# model: the class's suit (a skinned model on the astronaut rig).
# signature: the default starting weapon; familiar: weapons this class is
#   offered more often, which can also be chosen as the starting weapon once
#   unlocked (by class level in `unlocks`, or found on a dive).
# ability: the active (one button, cooldown). kind is a code archetype:
#   "bore" (tunnel through rock ahead, damaging anything in it: damage,
#           range = length in metres, width),
#   "barrier" (a wall of shock posts ahead: count posts, duration, damage
#           per second to enemies touching them),
#   "blink" (teleport up to range metres, damaging enemies on the way),
#   "dome" (a shield dome of radius `range` for `duration` seconds; `damage`
#   is the shock of an overcharged dome every half second).
#   tiers[n] applies from class level ability_levels[n].
# passive: stat effects (see perks.toml for effect names); each tier adds
#   per_tier. Tiers apply from class level passive_levels[n].
# color: suit accent (linear RGB).

[[class]]
id = "striker"
model = "suit-striker"
name = "Striker"
role = "Tempo and mobility"
description = "Fast, aggressive and best against big targets."
starter = true
signature = "pulse-blaster"
familiar = ["scattergun", "arc-caster", "ripper"]
color = [0.95, 0.42, 0.2]
ability = { kind = "blink", name = "Blink", description = "Teleport ahead through enemies, hurting everything you pass.", tiers = [
  { cooldown = 7.0, damage = 30.0, range = 6.0 },
  { cooldown = 6.0, damage = 45.0, range = 7.0 },
  { cooldown = 5.0, damage = 65.0, range = 8.0 },
] }
ability_levels = [1, 4, 8]
passive = { name = "Hunter", description = "Bonus damage to heavy enemies and a faster dash.", effects = [
  { effect = "heavy_damage", amount = 0.25, per_tier = 0.15 },
  { effect = "dash_cooldown", amount = 0.75, per_tier = -0.1 },
  { effect = "move_speed", amount = 1.06, per_tier = 0.02 },
] }
passive_levels = [1, 6, 10]
unlocks = [
  { level = 2, weapon = "scattergun" },
  { level = 5, weapon = "arc-caster" },
]

