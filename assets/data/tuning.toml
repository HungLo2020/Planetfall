# Global tuning. Times are seconds unless noted; distances are metres.

[player]
speed = 6.0
radius = 0.45
health = 100.0
pickup_range = 3.0
mining_rate = 3.0
# Plain rock drops one ferrite this often.
rock_ferrite_chance = 0.12
dash_speed = 17.0
dash_ticks = 11
dash_cooldown_ticks = 70
spawn_invulnerability = 2.0

[weapons]
max_carried = 4
# Dive levels that offer a choice of new weapon while a slot is free; every
# other level-up offers rarity-rolled upgrades.
pick_levels = [5, 10, 15]
# Weight multiplier for weapons the class is familiar with.
familiar_weight = 3.0
# Damage each upgrade on a weapon adds on top of the upgrade itself.
growth = 0.06

[rarity]
# Base odds of common, uncommon, rare and legendary upgrade offers.
weights = [60.0, 27.0, 10.0, 3.0]
# Perk amounts at each rarity.
perk_scale = [1.0, 1.6, 2.3, 3.2]
# Planet hazard above 1 (and luck) shift the odds toward rarer offers.
hazard_bonus = 0.5
# Supply caches always offer this rarity or better.
cache_min = "rare"

[xp]
# XP to advance from level n: base + n * per_level + n^2 * square, so later
# levels slow down while the threat keeps rising.
base = 5
per_level = 4
square = 0.3
cache_xp = 5

[horde]
# One group per period at intensity 1 (intensity grows with threat).
spawn_period = 3.6
cap = 160
tutorial_cap = 45
tutorial_intensity = 0.5

[threat]
# The threat level rises for the whole drop (faster during extraction) and drives spawn pressure, enemy toughness, elites
# and surges. Together with the steeper XP curve it caps how long a drop can
# last.
per_minute = 0.6
extraction_rate = 2.0
# Extra spawn pressure while the pod is inbound or waiting.
extraction_intensity = 1.6
spawn_per_level = 0.32
# Health and damage grow with threat^curve: gentle early, harsh late.
health_per_level = 0.15
damage_per_level = 0.06
curve = 1.3
# Surges: every `surge_every` levels a burst wave arrives `surge_warning`
# seconds after the HUD warns, with heavy pressure for `surge_duration`.
surge_every = 3
surge_warning = 8.0
surge_duration = 8.0
surge_intensity = 1.8
surge_burst = 4
surge_burst_per_level = 1

[hazard]
# Hazard levels 1 to 5, chosen per contract on the mission board. Level n
# unlocks after completing a primary objective at level n - 1.
names = ["Easy", "Normal", "Hard", "Brutal", "Lethal"]
enemy_health = [1.0, 1.25, 1.55, 1.9, 2.4]
enemy_damage = [1.0, 1.15, 1.3, 1.5, 1.75]
spawn = [1.0, 1.15, 1.3, 1.5, 1.7]
# Added elite chance.
elites = [0.0, 0.03, 0.06, 0.1, 0.15]
# Shifts upgrade rarity odds like luck.
rarity = [0.0, 0.25, 0.5, 0.8, 1.2]
# Banked materials and class XP on extraction.
reward = [1.0, 1.3, 1.65, 2.1, 2.7]
class_xp = [1.0, 1.2, 1.45, 1.75, 2.1]

[missions]
# Contracts on the mission board (refreshed after every drop and jump).
board = 3
secondary_chance = 0.75
mutator_chance = 0.35
# Seconds standing at a relay to scan it, at a downed survivor to revive
# them, and at the drill rig to start or repair it.
scan_seconds = 2.0
revive_seconds = 3.0
rig_start_seconds = 1.0
rig_health = 400.0
survivor_health = 150.0
# Class XP for each objective completed.
primary_class_xp = 60
secondary_class_xp = 40

[elites]
# Chance a spawned enemy is an elite: per threat level, capped.
per_level = 0.03
max = 0.35
xp = 4
# Affixes: armored (more health), swift (faster), frenzied (more damage).
armored_health = 3.0
swift_speed = 1.5
swift_health = 1.6
frenzied_damage = 1.7
frenzied_health = 1.8

[class]
# Class XP is earned from the XP collected on a dive plus
# `extraction_bonus` for getting out: all of it when the drop extracts,
# `failed_share` of the collected XP otherwise.
failed_share = 0.5
extraction_bonus = 40
# XP from class level n to n + 1: xp_base * xp_growth^(n - 1).
xp_base = 100.0
xp_growth = 1.3
max_level = 20

[extraction]
inbound = 12.0
hold = 6.0
radius = 3.6

[tutorial]
# Lumite needed in the tutorial drop.
objective = 4

[blocks]
# Ship build-mode costs.
deck = { ferrite = 2, lumite = 0, voidstone = 0 }
hull = { ferrite = 2, lumite = 0, voidstone = 0 }
window = { ferrite = 1, lumite = 1, voidstone = 0 }
lamp = { ferrite = 1, lumite = 1, voidstone = 0 }

[equipment]
# Affixes rolled at common, uncommon, rare and legendary.
affixes = [1, 2, 3, 4]
# Stat scale per rarity (the implicit stat and every affix).
scale = [1.0, 1.25, 1.55, 2.0]
# Extra stat scale per hazard level above 1.
hazard_scale = 0.08
# Supply caches always hold gear at least this rare (or a weapon blueprint).
cache_min = "uncommon"
# Chance a cache holds a familiar weapon blueprint for the class instead,
# while one is still to be found.
weapon_find = 0.35
# Chance an elite drops gear when it dies.
elite_drop = 0.08
# Bosses and hunted elites always drop gear this rare or better.
boss_min = "rare"
# Stash capacity; finds beyond it are salvaged for their credit value.
stash_size = 24

[trade]
# Credits for selling an item by rarity, plus per affix.
sell = [8, 20, 45, 100]
sell_per_affix = 4
# The station sells at this multiple of the sell price.
markup = 2.5
# Items on the station's shelf at each visit.
stock = 4
# Credits to reroll an item's affixes, by rarity.
reroll = [12, 30, 70, 150]
# Fuse this many unequipped items of one rarity into one of the next.
fuse = 3
fuse_cost = [10, 30, 80, 0]
# Materials change hands in lots of this size; credits per lot by material
# (ferrite, lumite, voidstone).
lot = 10
material_sell = [4, 10, 30]
material_buy = [10, 25, 75]

