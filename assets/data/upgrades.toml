# Ship modules: permanent upgrades bought at the Fabricator. The first level
# constructs `room` (inclusive tile rect x0, y0, x1, y1) on the ship.
# effect: max_health | damage | mining | pickup_range | nav_level (adds
# `per_level` each level). `costs[n]` is the price of level n + 1.

[[upgrade]]
id = "med-bay"
name = "Med Bay"
description = "+25 max health per level"
effect = "max_health"
per_level = 25.0
costs = [{ ferrite = 10, lumite = 2, voidstone = 0 }, { ferrite = 24, lumite = 6, voidstone = 2 }, { ferrite = 38, lumite = 10, voidstone = 4 }]
room = [1, 5, 5, 7]
station = "med-bay"
light = [0.5, 1.0, 0.6]
light_intensity = 1.4

[[upgrade]]
id = "armory"
name = "Armory"
description = "+12% weapon damage per level"
effect = "damage"
per_level = 0.12
costs = [{ ferrite = 14, lumite = 3, voidstone = 0 }, { ferrite = 28, lumite = 7, voidstone = 3 }, { ferrite = 42, lumite = 11, voidstone = 6 }]
room = [9, 5, 13, 7]
station = "weapon-rack"
light = [1.0, 0.92, 0.8]
light_intensity = 1.3
station_offset = [0.0, 0.0, -0.4]

[[upgrade]]
id = "drill-workshop"
name = "Drill Workshop"
description = "+35% mining speed per level"
effect = "mining"
per_level = 0.35
costs = [{ ferrite = 12, lumite = 2, voidstone = 0 }, { ferrite = 22, lumite = 5, voidstone = 2 }, { ferrite = 32, lumite = 8, voidstone = 4 }]
room = [1, 8, 5, 10]
station = "drill-rig"
light = [1.0, 0.92, 0.8]
light_intensity = 1.3
spin = { node = "bit", axis = "z", speed = 6.0 }

[[upgrade]]
id = "tractor-array"
name = "Tractor Array"
description = "+1.25 m pickup range per level"
effect = "pickup_range"
per_level = 1.25
costs = [{ ferrite = 8, lumite = 3, voidstone = 0 }, { ferrite = 18, lumite = 6, voidstone = 2 }, { ferrite = 28, lumite = 9, voidstone = 4 }]
room = [9, 8, 13, 10]
station = "beacon"
light = [1.0, 0.92, 0.8]
light_intensity = 1.3
spin = { node = "light", axis = "y", speed = 2.0 }
station_scale = 2.0

[[upgrade]]
id = "reactor"
name = "Reactor & Nav Core"
description = "Unlocks a more dangerous planet per level"
effect = "nav_level"
per_level = 1.0
costs = [{ ferrite = 20, lumite = 8, voidstone = 1 }, { ferrite = 40, lumite = 16, voidstone = 6 }]
room = [11, 11, 13, 15]
station = "reactor-core"
light = [0.45, 0.6, 1.0]
light_intensity = 2.2
spin = { node = "core", axis = "y", speed = 1.5 }
