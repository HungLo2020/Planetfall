# Equipment base types. Every class wears one item per slot (helmet, suit,
# boots, gadget). A found item is a base plus a rarity and random affixes
# (affixes.toml); the base's `implicit` stat scales with rarity like the
# affixes do. Gadgets carry the most unusual effects.
#
# effect names are the perk effects (perks.toml) plus `armor` (fraction of
# damage ignored) and `xp_gain` (extra XP per shard). Multiplicative effects
# (move_speed, fire_rate, dash_cooldown, ability_cooldown) give the factor.

[[gear]]
id = "scout-visor"
name = "Scout Visor"
slot = "helmet"
description = "A wide visor tuned to ore glints and XP shards. Scratch-resistant, mostly."
implicit = { effect = "pickup_range", amount = 1.0 }
weight = 3

[[gear]]
id = "miner-lamp"
name = "Miner's Lamp"
slot = "helmet"
description = "A drill-linked headlamp that finds the seam's weak lines."
implicit = { effect = "mining", amount = 0.2 }
weight = 3

[[gear]]
id = "targeting-helm"
