[workspace]
members = [".", "crates/planetfall-sim"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
planetfall-sim = { path = "crates/planetfall-sim" }
quasar-animation = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25" }
quasar-app = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25", default-features = false }
quasar-assets = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25", default-features = false }
quasar-audio = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25", default-features = false }
quasar-config = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25", default-features = false }
quasar-core = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25" }
quasar-diagnostics = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25", default-features = false }
quasar-frame = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25" }
quasar-input = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25" }
quasar-math = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25" }
quasar-nav = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25", default-features = false }
quasar-voxel = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25" }
quasar-voxel-mesh = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25" }
quasar-render-voxel = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25", default-features = false }
quasar-render-2d = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25", default-features = false }
quasar-sim = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25" }
quasar-render-3d = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25", default-features = false }
quasar-profile = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25", default-features = false }
quasar-spatial = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25", default-features = false }
quasar-storage = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25" }
quasar-text = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25", default-features = false }
quasar-ui = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25", default-features = false }
quasar-window = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25" }
vulkanic-gal = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[package]
name = "planetfall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Top-down sci-fi roguelite: build your ship, drop to hostile planets, mine, loot and extract."

[features]
default = ["desktop"]
# GPU rendering without a window (headless screenshots, cover art).
graphics = [
  "dep:quasar-animation",
  "dep:quasar-assets",
  "dep:quasar-frame",
  "dep:quasar-input",
  "dep:quasar-math",
  "dep:quasar-profile",
  "dep:quasar-render-2d",
  "dep:quasar-render-3d",
  "dep:quasar-render-voxel",
  "dep:quasar-text",
  "dep:quasar-ui",
  "dep:quasar-voxel",
  "dep:quasar-voxel-mesh",
  "dep:vulkanic-gal",
]
# Native window, audio and controllers through the optional quasar-app runner.
desktop = [
  "graphics",
  "dep:quasar-app",
  "quasar-app/desktop",
  "dep:quasar-audio",
  "dep:quasar-core",
  "quasar-input/gilrs",
  "dep:quasar-window",
]

[dependencies]
planetfall-sim.workspace = true
quasar-config = { workspace = true, features = ["json", "toml", "storage"] }
quasar-diagnostics.workspace = true
quasar-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
quasar-app = { workspace = true, optional = true }
quasar-animation = { workspace = true, optional = true, features = ["model"] }
quasar-assets = { workspace = true, optional = true, features = ["gltf"] }
quasar-audio = { workspace = true, optional = true, features = ["native", "settings"] }
quasar-core = { workspace = true, optional = true }
quasar-frame = { workspace = true, optional = true, features = ["vulkan", "png"] }
quasar-input = { workspace = true, optional = true }
quasar-math = { workspace = true, optional = true }
quasar-profile = { workspace = true, optional = true, features = ["frame"] }
quasar-render-2d = { workspace = true, optional = true, features = ["gpu", "vulkan", "png", "text"] }
quasar-render-3d = { workspace = true, optional = true, features = ["vulkan", "model-assets", "visibility"] }
quasar-render-voxel = { workspace = true, optional = true, features = ["vulkan"] }
quasar-text = { workspace = true, optional = true }
quasar-ui = { workspace = true, optional = true, features = ["input", "text-render2d", "controls-file"] }
quasar-voxel = { workspace = true, optional = true }
quasar-voxel-mesh = { workspace = true, optional = true }
quasar-window = { workspace = true, optional = true }
vulkanic-gal = { workspace = true, optional = true, features = ["vulkan"] }

[dev-dependencies]
tempfile.workspace = true

[profile.release]
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
